replicaCount: 2
image:
  repository: ghcr.io/lasttoss/game-center-api
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true
  datastorePorts:
    - 27017
    - 6379
config:
  mongoUri: mongodb://mongo:27017/gamecenter
  redisHost: redis
  redisPort: 6379
secret:
  # The credentials belong in a Secret that already exists; the chart never holds one.
  existingSecret: ""
  # Set true only to render or lint outside a cluster; a real install must name a Secret.
  allowMissing: false
