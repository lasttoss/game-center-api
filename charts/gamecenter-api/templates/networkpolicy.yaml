{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gamecenter-api.fullname" . }}
  labels:
    {{- include "gamecenter-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gamecenter-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Anything in the namespace may call the API on its own port - and a policy that forgets this is the
    # incident this portfolio has a written note about.
    - ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
  egress:
    # DNS, or nothing resolves.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Its own datastores, and nothing else: an egress rule that allows everything says nothing.
    - ports:
        {{- range .Values.networkPolicy.datastorePorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
