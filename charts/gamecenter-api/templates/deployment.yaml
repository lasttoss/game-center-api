apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gamecenter-api.fullname" . }}
  labels:
    {{- include "gamecenter-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Two replicas can roll without either of them leaving the Service.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "gamecenter-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gamecenter-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gamecenter-api.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: SPRING_DATA_MONGO_URI
              value: {{ .Values.config.mongoUri | quote }}
            - name: SPRING_DATA_REDIS_HOST
              value: {{ .Values.config.redisHost | quote }}
            - name: SPRING_DATA_REDIS_PORT
              value: {{ .Values.config.redisPort | quote }}
          # A TCP probe claims "the port is open", which is all a chart can honestly claim without knowing
          # the health path the application exposes.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # A JVM writes to /tmp; a read-only root filesystem needs somewhere for it to go.
        - name: tmp
          emptyDir: {}
