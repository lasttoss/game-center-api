name: ci

on:
  push:
    branches: [master, main]
    # A tag is what gives a released image its version; the branch gives it `latest` and its commit.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build
        run: ./mvnw -B -DskipTests package
      - name: Unit tests
        # The tests tagged "integration" need the MongoDB and Redis of docker-compose.yml, so they
        # do not run here; see ApplicationTests.
        run: ./mvnw -B test
      - name: Image builds
        run: docker build -t gamecenter-api:ci .


  image:
    # Only a push publishes. A pull request from a fork cannot write to the registry anyway, and a
    # pull request from a branch would be noise in a package nobody asked for.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 becomes 1.2.3 and 1.2, the branch becomes `master`, and the default branch also
          # gets `latest`; the commit short sha is there so an image can always be traced back.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
# amd64 only: the Maven build under emulation is slow enough to time the job out.
# The Dockerfile honours TARGETARCH, so an arm64 image is one line away.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An image that says what it was built from, and a list of what is inside it.
          provenance: true
          sbom: true

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint the chart strictly
        run: make chart
      - name: The chart must refuse to render without credentials
        # A guard nobody tests is a guard that quietly stops working - the same rule the chart's own
        # message points at, and the one that failed silently before this step existed.
        run: make guard
      - name: The rendered manifest must keep its claims
        run: |
          helm template dev charts/gamecenter-api > /tmp/render.yaml
          for claim in "maxUnavailable: 0" "minAvailable: 1" "automountServiceAccountToken: false" \
                       "readOnlyRootFilesystem: true" "tcpSocket" "kind: HorizontalPodAutoscaler" \
                       "kind: PodDisruptionBudget" "kind: NetworkPolicy"; do
            grep -q "$claim" /tmp/render.yaml || { echo "the chart no longer has: $claim"; exit 1; }
          done
          echo "every claim is in the manifest"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The test the pom excludes needs these two; the pom's own comment says how to run it.
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: The integration test, with the stack it asks for
        run: ./mvnw -B test -Dgroups=integration
