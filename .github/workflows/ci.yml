name: ci

on:
  push:
    branches: [master, main]
    # A tag is what gives a released image its version; the branch gives it `latest` and its commit.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build
        run: ./mvnw -B -DskipTests package
      - name: Unit tests
        # The tests tagged "integration" need the MongoDB and Redis of docker-compose.yml, so they
        # do not run here; see ApplicationTests.
        run: ./mvnw -B test
      - name: Image builds
        run: docker build -t gamecenter-api:ci .


  image:
    # Only a push publishes. A pull request from a fork cannot write to the registry anyway, and a
    # pull request from a branch would be noise in a package nobody asked for.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 becomes 1.2.3 and 1.2, the branch becomes `master`, and the default branch also
          # gets `latest`; the commit short sha is there so an image can always be traced back.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
# amd64 only: the Maven build under emulation is slow enough to time the job out.
# The Dockerfile honours TARGETARCH, so an arm64 image is one line away.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An image that says what it was built from, and a list of what is inside it.
          provenance: true
          sbom: true
