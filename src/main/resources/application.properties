spring.application.name=gamecenter.api
server.port=${SERVER_PORT:8080}

# MongoDB - MongoConfig reads spring.data.mongo.uri through the environment
spring.data.mongo.uri=${SPRING_DATA_MONGO_URI:mongodb://localhost:27017/gamecenter}

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:1}

# JWT signing secret - change it in anything that is not a laptop
jwt.secret=${JWT_SECRET:dev-secret-change-me}

# OpenAPI UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
